name: Cross-Platform CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --release --verbose

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: clump-${{ matrix.os }}
        path: |
          target/release/clump
          target/release/clump.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package artifacts for release
      run: |
        cd artifacts
        mkdir release-files
        
        # Package Linux binary
        if [ -d "clump-ubuntu-latest" ]; then
          tar -czf release-files/clump-linux.tar.gz -C clump-ubuntu-latest clump
        fi
        
        # Package macOS binary
        if [ -d "clump-macos-latest" ]; then
          tar -czf release-files/clump-macos.tar.gz -C clump-macos-latest clump
        fi
        
        # Package Windows binary
        if [ -d "clump-windows-latest" ]; then
          zip -j release-files/clump-windows.zip clump-windows-latest/clump.exe
        fi
        
        # Generate checksums
        cd release-files
        sha256sum * > checksums.txt

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/release-files/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
